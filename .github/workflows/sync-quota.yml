name: 每日抓取纳指100场外基金额度

on:
  schedule:
    # UTC 03:40 = 北京时间 11:40。留 20 分钟余量，避开 GitHub 定时任务的排队延迟
    - cron: "40 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-quota
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 配齐这三项后，「写入微信云开发」步骤才会执行；缺省时自动跳过，CI 不会报红
      WX_APPID: ${{ secrets.WX_APPID }}
      WX_SECRET: ${{ secrets.WX_SECRET }}
      WX_CLOUD_ENV: ${{ secrets.WX_CLOUD_ENV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 预检数据源连通性
        run: |
          # 海外 runner 访问境内接口是这套方案唯一的未知数，先探一次写进日志，
          # 失败也继续跑，让 sync.py 自己重试并给出真实结果。
          for u in \
            "https://fundmobapi.eastmoney.com/FundMApi/FundRateInfo.ashx?FCODE=000834&deviceid=1&plat=Android&product=EFund&version=6.2.8" \
            "https://www.fund123.cn/matiaria?fundCode=000834" \
            "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=100.NDX100&klt=101&fqt=1&lmt=5&fields1=f1,f2,f3&fields2=f51,f53"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -A "Mozilla/5.0" "$u" || echo "000")
            echo "HTTP $code  ${u:0:45}"
            if [ "$code" != "200" ]; then
              echo "::warning::数据源响应 $code，sync.py 可能抓不到数据"
            fi
          done

      - name: 抓取天天基金 + 支付宝 + 纳指100行情
        run: python scripts/sync.py --emit-sql

      - name: 生成发布产物
        id: build
        run: |
          SNAPSHOT=$(ls -t scripts/out/snapshot-*.json | head -1)
          echo "快照文件: $SNAPSHOT"
          python scripts/emit_ci_artifacts.py "$SNAPSHOT" --out data --parts 3 | tee build.log

      - name: 写入微信云开发数据库
        if: env.WX_APPID != ''
        run: python scripts/push_to_wxcloud.py data/latest.json | tee push.log

      - name: 写入任务摘要
        if: always()
        run: |
          {
            echo "## 抓取结果"
            echo '```'
            cat build.log 2>/dev/null || echo "无产物，抓取步骤可能已失败"
            echo '```'
            if [ -f push.log ]; then
              echo "## 云开发写入"
              echo '```'
              cat push.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交产物
        run: |
          git config user.name "quota-bot"
          git config user.email "quota-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 额度快照"
            git push
          fi
